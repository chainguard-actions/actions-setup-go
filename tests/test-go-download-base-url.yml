name: Test go-download-base-url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          go-version: '1.21.x'
          go-download-base-url: 'https://go.dev/dl'
      - name: Assert go-version output is set
        env:
          GO_VERSION: ${{ steps.action.outputs.go-version }}
        run: |
          echo "go-version: $GO_VERSION"
          if [ -z "$GO_VERSION" ]; then
            echo "FAIL: go-version output is empty"
            exit 1
          fi
          echo "PASS: go-version is '$GO_VERSION'"
      - name: Assert go binary is available
        run: |
          if ! command -v go &>/dev/null; then
            echo "FAIL: go binary not found in PATH"
            exit 1
          fi
          echo "PASS: go is available at $(command -v go)"
          go version
