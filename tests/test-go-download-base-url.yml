name: Test go-download-base-url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-go
        uses: .
        with:
          go-version: '1.21'
          go-download-base-url: 'https://go.dev/dl'
          cache: false
      - name: Assert go-version output is set
        env:
          GO_VERSION: ${{ steps.setup-go.outputs.go-version }}
        run: |
          echo "go-version: $GO_VERSION"
          if [ -z "$GO_VERSION" ]; then
            echo "FAIL: go-version output is empty"
            exit 1
          fi
          echo "PASS: go-version is $GO_VERSION"
      - name: Assert go binary is available
        run: |
          which go
          go version
          echo "PASS: go binary is available"
