name: Test Go setup from .go-version file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          go-version-file: 'tests/fixtures/.go-version'
          cache: false
      - name: Assert go-version output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.go-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: go-version output is empty"
            exit 1
          fi
          echo "PASS: go-version output is '$ACTUAL'"
      - name: Assert Go binary is available and version matches .go-version
        run: |
          which go
          GO_VER=$(go version)
          echo "go version: $GO_VER"
          if ! echo "$GO_VER" | grep -q "go1.22"; then
            echo "FAIL: expected go1.22 (from .go-version) but got: $GO_VER"
            exit 1
          fi
          echo "PASS"
