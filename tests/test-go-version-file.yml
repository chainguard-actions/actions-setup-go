name: Test go-version-file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          go-version-file: tests/fixtures/gomod/go.mod
          cache: false
      - name: Assert go-version output
        env:
          ACTUAL: ${{ steps.action.outputs.go-version }}
        run: |
          echo "actual: $ACTUAL"
          case "$ACTUAL" in
            1.19*) echo "PASS" ;;
            *) echo "FAIL: expected version starting with 1.19"; exit 1 ;;
          esac
          go version | grep -q 'go1\.19' || { echo "FAIL: go on PATH not 1.19"; exit 1; }
          echo "PASS: go on PATH"
