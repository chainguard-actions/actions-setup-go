name: Test Go setup with stable version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          go-version: 'stable'
          cache: false
      - name: Assert go-version output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.go-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: go-version output is empty"
            exit 1
          fi
          echo "PASS: go-version output is '$ACTUAL'"
      - name: Assert go binary is on PATH
        run: |
          which go
          if [ $? -ne 0 ]; then
            echo "FAIL: go binary not found on PATH"
            exit 1
          fi
          echo "PASS: go binary found at $(which go)"
      - name: Assert go version is a valid semver
        run: |
          INSTALLED="$(go version)"
          echo "installed: $INSTALLED"
          # Verify it looks like a real go version string
          if ! echo "$INSTALLED" | grep -qE "go[0-9]+\.[0-9]+"; then
            echo "FAIL: go version output does not look like a valid version: $INSTALLED"
            exit 1
          fi
          echo "PASS: stable go version installed: $INSTALLED"
