name: Test Go setup with stable version range
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          go-version: '>=1.21.0'
          cache: false
      - name: Assert go-version output is set
        env:
          GO_VERSION: ${{ steps.setup.outputs.go-version }}
        run: |
          echo "go-version output: $GO_VERSION"
          if [ -z "$GO_VERSION" ]; then
            echo "FAIL: go-version output is empty"
            exit 1
          fi
          echo "PASS: go-version output is '$GO_VERSION'"
      - name: Assert go binary is on PATH and version is at least 1.21
        run: |
          which go || { echo "FAIL: go not found on PATH"; exit 1; }
          INSTALLED=$(go version | awk '{print $3}' | sed 's/go//')
          echo "Installed Go version: $INSTALLED"
          MAJOR=$(echo "$INSTALLED" | cut -d. -f1)
          MINOR=$(echo "$INSTALLED" | cut -d. -f2)
          if [ "$MAJOR" -lt 1 ] || { [ "$MAJOR" -eq 1 ] && [ "$MINOR" -lt 21 ]; }; then
            echo "FAIL: expected Go >= 1.21 but got $INSTALLED"
            exit 1
          fi
          echo "PASS: Go version $INSTALLED satisfies >=1.21.0"
