name: Test check-latest
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          go-version: '1.20'
          check-latest: true
          cache: false
      - name: Assert latest 1.20 patch installed
        env:
          ACTUAL: ${{ steps.action.outputs.go-version }}
        run: |
          echo "actual: $ACTUAL"
          case "$ACTUAL" in
            1.20.*) echo "PASS" ;;
            *) echo "FAIL: expected 1.20.x patch version"; exit 1 ;;
          esac
          go version
