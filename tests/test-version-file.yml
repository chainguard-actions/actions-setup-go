name: Test Go setup with go-version-file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create go.mod fixture
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/gomod"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/gomod/go.mod" <<'EOF'
          module example.com/test

          go 1.21
          EOF
      - id: setup-go
        uses: .
        with:
          go-version-file: 'tests/fixtures/gomod/go.mod'
          cache: false
      - name: Assert go-version output is set
        env:
          GO_VERSION: ${{ steps.setup-go.outputs.go-version }}
        run: |
          echo "go-version output: $GO_VERSION"
          if [ -z "$GO_VERSION" ]; then
            echo "FAIL: go-version output is empty"
            exit 1
          fi
          echo "PASS: go-version output is '$GO_VERSION'"
      - name: Assert go binary is on PATH
        run: |
          which go || { echo "FAIL: go not found on PATH"; exit 1; }
          echo "PASS: go found at $(which go)"
      - name: Assert go version matches go.mod
        run: |
          INSTALLED="$(go version)"
          echo "installed: $INSTALLED"
          if ! echo "$INSTALLED" | grep -q "go1.21"; then
            echo "FAIL: expected go1.21.x but got: $INSTALLED"
            exit 1
          fi
          echo "PASS: correct Go version installed from go.mod"
