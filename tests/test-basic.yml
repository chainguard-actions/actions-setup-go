name: Test basic go-version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          go-version: '1.20'
          cache: false
      - name: Assert go-version output
        env:
          ACTUAL: ${{ steps.action.outputs.go-version }}
        run: |
          echo "actual: $ACTUAL"
          case "$ACTUAL" in
            1.20*) echo "PASS" ;;
            *) echo "FAIL: expected version starting with 1.20"; exit 1 ;;
          esac
      - name: Assert go is on PATH
        run: |
          go version
          if ! go version | grep -q 'go1\.20'; then
            echo "FAIL: go on PATH is not 1.20"
            exit 1
          fi
          echo "PASS"
