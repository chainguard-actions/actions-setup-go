name: Test Go setup with explicit architecture
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-go
        uses: .
        with:
          go-version: '1.21.0'
          architecture: 'x64'
          cache: false
      - name: Assert go-version output is set
        env:
          GO_VERSION: ${{ steps.setup-go.outputs.go-version }}
        run: |
          echo "go-version output: $GO_VERSION"
          if [ -z "$GO_VERSION" ]; then
            echo "FAIL: go-version output is empty"
            exit 1
          fi
          echo "PASS: go-version output is '$GO_VERSION'"
      - name: Assert go binary is on PATH
        run: |
          which go || { echo "FAIL: go not found on PATH"; exit 1; }
          echo "PASS: go found at $(which go)"
      - name: Assert go is amd64 architecture
        run: |
          GOARCH="$(go env GOARCH)"
          echo "GOARCH: $GOARCH"
          if [ "$GOARCH" != "amd64" ]; then
            echo "FAIL: expected amd64 but got: $GOARCH"
            exit 1
          fi
          echo "PASS: Go architecture is amd64 (x64)"
