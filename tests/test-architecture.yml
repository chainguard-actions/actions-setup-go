name: Test architecture input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-go
        uses: .
        with:
          go-version: '1.21'
          architecture: 'x64'
          cache: false
      - name: Assert go-version output is set
        env:
          ACTUAL: ${{ steps.setup-go.outputs.go-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: go-version output is empty"
            exit 1
          fi
          echo "PASS: go-version output is set to $ACTUAL"
      - name: Assert go is available on PATH
        run: |
          which go
          go version
          echo "PASS: go is available"
      - name: Assert go version matches expected
        run: |
          GO_VER="$(go version)"
          echo "go version: $GO_VER"
          if ! echo "$GO_VER" | grep -q "go1.21"; then
            echo "FAIL: expected go1.21.x but got: $GO_VER"
            exit 1
          fi
          echo "PASS: go version matches expected"
