name: Test Go setup with explicit architecture
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          go-version: '1.21.x'
          architecture: 'x64'
          cache: false
      - name: Assert go-version output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.go-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: go-version output is empty"
            exit 1
          fi
          echo "PASS: go-version output is '$ACTUAL'"
      - name: Assert go binary is on PATH
        run: |
          which go || { echo "FAIL: go not found on PATH"; exit 1; }
          echo "PASS: go is on PATH"
      - name: Assert go binary is amd64
        run: |
          GO_ENV="$(go env GOARCH)"
          echo "GOARCH: $GO_ENV"
          if [ "$GO_ENV" != "amd64" ]; then
            echo "FAIL: expected amd64 but got: $GO_ENV"
            exit 1
          fi
          echo "PASS"
