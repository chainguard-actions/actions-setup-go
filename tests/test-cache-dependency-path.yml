name: Test cache-dependency-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create go.sum fixture
        run: |
          mkdir -p "$GITHUB_WORKSPACE/hardened/tests/fixtures"
          touch "$GITHUB_WORKSPACE/hardened/tests/fixtures/go.sum"
      - id: setup-go
        uses: .
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: hardened/tests/fixtures/go.sum
      - name: Assert go-version output is set
        env:
          GO_VERSION: ${{ steps.setup-go.outputs.go-version }}
        run: |
          echo "go-version: $GO_VERSION"
          if [ -z "$GO_VERSION" ]; then
            echo "FAIL: go-version output is empty"
            exit 1
          fi
          echo "PASS: go-version is $GO_VERSION"
      - name: Assert go binary is on PATH
        run: |
          which go
          go version
          echo "PASS: go is available on PATH"
