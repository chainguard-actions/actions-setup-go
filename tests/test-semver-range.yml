name: Test Go setup with semver range
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          go-version: '>=1.20.0'
          cache: false
      - name: Assert go-version output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.go-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: go-version output is empty"
            exit 1
          fi
          echo "PASS: go-version output is '$ACTUAL'"
      - name: Assert Go version satisfies range
        run: |
          which go
          GO_VER=$(go version)
          echo "go version: $GO_VER"
          # Extract major.minor version number
          VERSION=$(go version | grep -oP 'go\K[0-9]+\.[0-9]+' | head -1)
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          echo "Parsed major=$MAJOR minor=$MINOR"
          if [ "$MAJOR" -lt 1 ] || { [ "$MAJOR" -eq 1 ] && [ "$MINOR" -lt 20 ]; }; then
            echo "FAIL: expected Go >= 1.20 but got: $GO_VER"
            exit 1
          fi
          echo "PASS: Go $VERSION satisfies >=1.20.0"
