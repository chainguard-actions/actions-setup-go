name: Test Go setup with semver range
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          go-version: '>=1.20.0 <1.22.0'
          cache: false
      - name: Assert go-version output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.go-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: go-version output is empty"
            exit 1
          fi
          echo "PASS: go-version output is '$ACTUAL'"
      - name: Assert go binary is on PATH
        run: |
          which go || { echo "FAIL: go not found on PATH"; exit 1; }
          echo "PASS: go is on PATH"
      - name: Assert go version is within range
        run: |
          GO_VER="$(go version)"
          echo "go version: $GO_VER"
          # Extract minor version number
          MINOR=$(go version | grep -oE 'go1\.[0-9]+' | head -1 | grep -oE '[0-9]+$')
          echo "minor version: $MINOR"
          if [ -z "$MINOR" ]; then
            echo "FAIL: could not parse minor version from: $GO_VER"
            exit 1
          fi
          if [ "$MINOR" -lt 20 ] || [ "$MINOR" -ge 22 ]; then
            echo "FAIL: expected go1.20.x or go1.21.x but got: $GO_VER"
            exit 1
          fi
          echo "PASS: go version $GO_VER is within range >=1.20.0 <1.22.0"
