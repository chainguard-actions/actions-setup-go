name: Test Go setup cache-hit output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create go.mod for cache dependency
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/cache-test"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/cache-test/go.mod" <<'EOF'
          module example.com/cache-test

          go 1.21
          EOF
          touch "$GITHUB_WORKSPACE/tests/fixtures/cache-test/go.sum"
      - id: setup
        uses: .
        with:
          go-version: '1.21.x'
          cache: true
          cache-dependency-path: 'tests/fixtures/cache-test/go.sum'
      - name: Assert go-version output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.go-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: go-version output is empty"
            exit 1
          fi
          echo "PASS: go-version output is '$ACTUAL'"
      - name: Assert cache-hit output is defined (true or false)
        env:
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          if [ "$CACHE_HIT" != "true" ] && [ "$CACHE_HIT" != "false" ] && [ "$CACHE_HIT" != "" ]; then
            echo "FAIL: cache-hit should be 'true', 'false', or empty but got: $CACHE_HIT"
            exit 1
          fi
          echo "PASS: cache-hit output is valid: '$CACHE_HIT'"
      - name: Assert go binary is on PATH
        run: |
          which go || { echo "FAIL: go not found on PATH"; exit 1; }
          echo "PASS: go is on PATH"
