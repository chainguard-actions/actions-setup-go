name: Test Go setup with caching enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create go.mod and go.sum for cache
        run: |
          cat > "$GITHUB_WORKSPACE/go.mod" <<'EOF'
          module example.com/cachetest

          go 1.21
          EOF
          touch "$GITHUB_WORKSPACE/go.sum"
      - id: setup-go
        uses: .
        with:
          go-version: '1.21.0'
          cache: true
          cache-dependency-path: 'go.sum'
      - name: Assert go-version output is set
        env:
          GO_VERSION: ${{ steps.setup-go.outputs.go-version }}
        run: |
          echo "go-version output: $GO_VERSION"
          if [ -z "$GO_VERSION" ]; then
            echo "FAIL: go-version output is empty"
            exit 1
          fi
          echo "PASS: go-version output is '$GO_VERSION'"
      - name: Assert cache-hit output is set (true or false)
        env:
          CACHE_HIT: ${{ steps.setup-go.outputs.cache-hit }}
        run: |
          echo "cache-hit output: $CACHE_HIT"
          if [ "$CACHE_HIT" != "true" ] && [ "$CACHE_HIT" != "false" ] && [ "$CACHE_HIT" != "" ]; then
            echo "FAIL: unexpected cache-hit value: '$CACHE_HIT'"
            exit 1
          fi
          echo "PASS: cache-hit output is '$CACHE_HIT'"
      - name: Assert go binary is on PATH
        run: |
          which go || { echo "FAIL: go not found on PATH"; exit 1; }
          echo "PASS: go found at $(which go)"
