name: Test Go setup with caching enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare tool cache directory
        run: |
          mkdir -p /tmp/hostedtoolcache
          echo "RUNNER_TOOL_CACHE=/tmp/hostedtoolcache" >> "$GITHUB_ENV"
      - id: setup
        uses: .
        with:
          go-version: '1.22.x'
          cache: true
          cache-dependency-path: '${{ github.workspace }}/tests/fixtures/cache-test/go.sum'
      - name: Assert go-version output is set
        env:
          GO_VERSION: ${{ steps.setup.outputs.go-version }}
        run: |
          echo "go-version output: $GO_VERSION"
          if [ -z "$GO_VERSION" ]; then
            echo "FAIL: go-version output is empty"
            exit 1
          fi
          echo "PASS: go-version output is '$GO_VERSION'"
      - name: Assert cache-hit output is a boolean string
        env:
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: |
          echo "cache-hit output: $CACHE_HIT"
          if [ "$CACHE_HIT" != "true" ] && [ "$CACHE_HIT" != "false" ] && [ "$CACHE_HIT" != "" ]; then
            echo "FAIL: cache-hit should be 'true', 'false', or empty but got: $CACHE_HIT"
            exit 1
          fi
          echo "PASS: cache-hit output is valid: '$CACHE_HIT'"
      - name: Assert Go binary is available
        run: |
          go version
          echo "PASS: go binary is functional"
